services:
  backend-quarkus:
    build:
      context: ./backend/quarkus
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend/quarkus:/app:Z
      - quarkus-maven-cache:/root/.m2
    ports:
      - "8081:8081"
    environment:
      QUARKUS_HTTP_HOST: 0.0.0.0
      QUARKUS_HTTP_PORT: 8081

volumes:
  quarkus-maven-cache: