services:
  backend-quarkus:
    build:
      context: ./backend/quarkus
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend/quarkus:/app:Z
      - quarkus-maven-cache:/root/.m2
    ports:
      - "8081:8081"
    environment:
      QUARKUS_HTTP_HOST: 0.0.0.0
      QUARKUS_HTTP_PORT: 8081

  frontend-angular:
    build:
      context: ./frontend/angular
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend/angular:/app:Z
      - angular-node-modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"

  frontend-react:
    build:
      context: ./frontend/react
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend/react:/app:Z
      - react-node-modules:/app/node_modules
    ports:
      - "5173:5173"

volumes:
  quarkus-maven-cache:
  angular-node-modules:
  react-node-modules: