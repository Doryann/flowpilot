services:
  postgres:
    image: docker.io/library/postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: flowpilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - flowpilot-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flowpilot"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-springboot:
    build:
      context: ..
      dockerfile: backend/springboot/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flowpilot
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  backend-quarkus:
    build:
      context: ..
      dockerfile: backend/quarkus/Dockerfile
    restart: unless-stopped
    environment:
      QUARKUS_HTTP_HOST: 0.0.0.0
      QUARKUS_HTTP_PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  frontend-angular:
    build:
      context: ..
      dockerfile: frontend/angular/Dockerfile
    restart: unless-stopped
    ports:
      - "4200:80"

  frontend-react:
    build:
      context: ..
      dockerfile: frontend/react/Dockerfile
    restart: unless-stopped
    ports:
      - "5173:80"

volumes:
  flowpilot-postgres-data: