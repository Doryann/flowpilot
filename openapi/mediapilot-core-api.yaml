openapi: 3.0.3

info:
  title: MediaFlow Core API
  version: 1.0.0
  description: Core API for managing personal media library items.

servers:
  - url: http://localhost:8080
    description: Local Spring Boot backend

tags:
  - name: Media
    description: Media management endpoints

paths:
  /api/media:
    get:
      tags:
        - MediaQuery
      operationId: findAllMedia
      summary: Find all media
      responses:
        '200':
          description: List of media
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './components/media-schemas.yaml#/components/schemas/MediaResponse'

    post:
      tags:
        - MediaCommand
      operationId: createMedia
      summary: Create a media item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components/media-schemas.yaml#/components/schemas/CreateMediaRequest'
      responses:
        '201':
          description: Media created
          content:
            application/json:
              schema:
                $ref: './components/media-schemas.yaml#/components/schemas/IdentificationResponse'

  /api/media/{mediaId}:
    get:
      tags:
        - MediaQuery
      operationId: findMediaById
      summary: Find media by id
      responses:
        '200':
          description: Media found
          content:
            application/json:
              schema:
                $ref: './components/media-schemas.yaml#/components/schemas/MediaResponse'
    put:
      tags:
        - MediaCommand
      operationId: updateMedia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components/media-schemas.yaml#/components/schemas/CreateMediaRequest'
      responses:
        202:
          description: UPDATED
          content:
            application/json:
              schema:
                $ref: './components/media-schemas.yaml#/components/schemas/IdentificationResponse'
    delete:
      tags:
        - MediaCommand
      operationId: deleteMedia
      responses:
        200:
          description: DELETED
          content:
            application/json:
              schema:
                $ref: './components/media-schemas.yaml#/components/schemas/IdentificationResponse'
    parameters:
      - name: mediaId
        in: path
        required: true
        schema:
          type: string
          format: uuid

  /api/media/{mediaId}/status:
    patch:
      tags:
        - MediaCommand
      operationId: changeMediaStatus
      summary: Change media status
      parameters:
        - name: mediaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components/media-schemas.yaml#/components/schemas/ChangeMediaStatusRequest'
      responses:
        '204':
          description: Status changed

  /api/media/{mediaId}/rating:
    patch:
      tags:
        - MediaCommand
      operationId: changeMediaRating
      summary: Change media rating
      parameters:
        - name: mediaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components/media-schemas.yaml#/components/schemas/ChangeMediaRatingRequest'
      responses:
        '204':
          description: Rating changed