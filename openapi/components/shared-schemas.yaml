components:
  schemas:
    IdentificationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid

    UpdateUserProfileRequest:
      type: object
      required:
        - username
        - displayName
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 100

        displayName:
          type: string
          minLength: 1
          maxLength: 150

        avatarUrl:
          type: string
          maxLength: 512

    UserDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid

        username:
          type: string
          maxLength: 100

        displayName:
          type: string
          maxLength: 150

        email:
          type: string
          format: email

        avatarUrl:
          type: string
          maxLength: 512

        role:
          type: string
          enum:
            - USER
            - ADMIN

        active:
          type: boolean

        createdAt:
          type: string
          format: date-time
          readOnly: true

        updatedAt:
          type: string
          format: date-time
          readOnly: true
          nullable: true